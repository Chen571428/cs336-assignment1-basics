[project]
name = "cs336_basics"
version = "26.0.0"
description = "CS336 Assignment 1"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "einops>=0.8.1", # tensor operations
    "einx>=0.4", # more general tensor operations
    "jaxtyping>=0.3", # type hints for pytorch/jax/numpy
    "numpy>=2.4",
    "psutil>=7",
    "pytest>=9.0",
    "pytest-timeout",
    "regex>=2026.3.32", # more powerful regex than the builtin `re` module
    "tiktoken>=0.12.0",
    "torch~=2.11.0", 
    "tqdm>=4.67.1",
    "wandb>=0.25",
    "ty>=0.0.26",
    "ruff >= 0.15.8", 
    "rich>=14.2.0",
    "pytest-json-report>=1.5.0",
    "maturin>=1.11.5",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["maturin>=1.11.5" ]
build-backend = "maturin"

[tool.maturin]
manifest-path = "cs336_basics/rust/Cargo.toml"
python-source = "."
module-name = "cs336_basics.rust"

[tool.uv]
package = true
python-preference = "managed"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint.extend-per-file-ignores]
# Also ignore `E402` in all `__init__.py` files.
"__init__.py" = ["E402", "F401", "F403", "E501"]

[tool.ruff.lint]
extend-select = ["UP"]
ignore = ["F722"]
